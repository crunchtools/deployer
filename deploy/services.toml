# The deploy registry. One table per service.
#
# The key is the PODMAN CONTAINER NAME, which is what a ticket's `service:`
# line must say. It is not the unit name minus `.service`: acquacotta's
# container and unit match, mcp-pcloud's and mcp-nagios's do not. Read it from
# `podman inspect --format '{{.Name}}'` rather than assuming.
#
# A seat's ticket names the service, the repo and the commit. Everything about
# how that deploy is *proved* -- the probe, what it must answer, how long it
# must hold -- lives here, so a seat cannot choose its own proof.
#
# An unknown key is a load error, not a value that is ignored. `also_restart`
# and `preflight` are refused by name: neither is in 0.1.0.
#
# `ready` and `settle` are two different windows and the difference is not
# cosmetic. `ready` is how long the service may take to answer its probe AT
# ALL after the restart, retried, and it ends on the first passing answer --
# so a generous one costs nothing when the service comes up fast. `settle` is
# how long it must then keep answering, sampled, with the first failure fatal.
# Running them as one window is what made every service here undeployable
# until 0.1.3: a container unit is active the moment conmon reports the
# process started, seconds before the process inside it binds its port, and
# the settle window's first sample landed in that gap. `ready` defaults to 60.
# Err generous: too large only delays a failure report, too small invents one.
#
# On `requestors`: every ticket a seat files arrives as `Creator: scott`,
# because the seats have no RT accounts of their own -- mcp-rt authenticates as
# scott for all of them. Who may ask for a deploy is therefore enforced at the
# Trentina gateway, by profile, where the seats ARE distinguishable
# (`create_ticket` into Deploy is allowed for developer and josui, denied for
# kagetora, takeda, claude-web and gemini-web). This list is the second line of
# that, and it becomes worth splitting the day the seats get RT users.
#
# On `rebuilder` (RT#1551): the fleet CVE lane was re-scoped (cto 2026-11-11) to
# detect + file bump tickets, NOT to auto-rebuild/deploy, after a rebuild was
# proven not to clear pinned-dependency CVEs. So `rebuilder` is intentionally
# NOT a requestor here: the ticket-filing credential must not be able to trigger
# a deploy. The errata runner tests stay; they pin real deployer behaviour.

[service."acquacotta.crunchtools.com"]
repo = "crunchtools/acquacotta"
image = "quay.io/crunchtools/acquacotta"
unit = "acquacotta.crunchtools.com.service"
nagios_host = "ctr-acquacotta.crunchtools.com"
requestors = ["scott"]
# NOT /health -- that route answers 500 on this service today. /api/plugins
# exercises the app and the database behind it, which is what a probe is for.
probe = { kind = "http", url = "http://127.0.0.1:8080/api/plugins", expect_status = 200 }
# This container runs its own init, so it writes nothing to the container's
# stdout and a failure comment carries no log tail -- the deployer says where to
# look instead (`podman exec acquacotta.crunchtools.com journalctl -n 50`).
# Measured, not assumed: podman's logs endpoint returns 0 bytes for it while
# both MCP servers return their startup lines.
settle = 60
# Not measured, and deliberately well over any plausible answer: this one runs
# systemd, then httpd, then the app, then reaches a database, and the probe
# exercises all of it. The cost of being wrong in this direction is a slower
# failure report; the cost of being wrong in the other is a healthy deploy
# rolled back.
ready = 180
rollback = "auto"

[service."mcp-pcloud"]
repo = "crunchtools/mcp-pcloud"
image = "quay.io/crunchtools/mcp-pcloud"
# The container is `mcp-pcloud`; the unit carries the full hostname.
unit = "mcp-pcloud.crunchtools.com.service"
nagios_host = "ctr-mcp-pcloud.crunchtools.com"
requestors = ["scott"]
# No health route at all: a GET of /mcp answers 400. The `mcp` probe POSTs a
# JSON-RPC initialize and reads the answer, which is the only check that proves
# an MCP server is actually serving rather than merely listening.
probe = { kind = "mcp", url = "http://127.0.0.1:8028/mcp" }
settle = 30
# Measured: uvicorn printed "Uvicorn running on http://0.0.0.0:8028" and began
# answering within a few seconds of the restart. 60 is the default and is
# already several times that, so it is left unstated rather than written down
# as though it had been tuned.
rollback = "auto"

[service."mcp-nagios"]
repo = "crunchtools/mcp-nagios"
image = "quay.io/crunchtools/mcp-nagios"
unit = "mcp-nagios.crunchtools.com.service"
nagios_host = "ctr-mcp-nagios.crunchtools.com"
requestors = ["scott"]
probe = { kind = "mcp", url = "http://127.0.0.1:8026/mcp" }
settle = 30
rollback = "auto"

[service."mcp-cloudflare"]
repo = "crunchtools/mcp-cloudflare"
image = "quay.io/crunchtools/mcp-cloudflare"
# The container is `mcp-cloudflare`; the unit carries the full hostname.
unit = "mcp-cloudflare.crunchtools.com.service"
nagios_host = "ctr-mcp-cloudflare.crunchtools.com"
requestors = ["scott"]
# Measured 200 against an initialize POST before onboarding. There is no
# /health route, which is why every MCP server here probes the handshake
# instead of a status code that would pass without testing anything.
probe = { kind = "mcp", url = "http://127.0.0.1:8008/mcp" }
settle = 30
# NOT THE ROBOT'S JOB, AND NOT ITS FAULT: after this deploys, sessions already
# connected to the gateway keep their old tool list until someone runs
# reconnect_backend cloudflare. That is crunchtools/trentina#752. The deployer
# holds no capability to call into the gateway and should not gain one -- it is
# a model-free root process that will shortly be deploying the gateway itself.
rollback = "auto"

[service."images.rootsofthevalley.org"]
repo = "crunchtools/rotv"
image = "quay.io/crunchtools/images-rotv"
unit = "images.rootsofthevalley.org.service"
nagios_host = "ctr-images.rootsofthevalley.org"
requestors = ["scott"]
# Measured 200 before onboarding. /health is 404 on this one -- the route is
# under /api.
probe = { kind = "http", url = "http://127.0.0.1:8094/api/health", expect_status = 200 }
settle = 60
# This is the image-server, not the app: it runs no migrations of its own, so
# it comes up quickly. The default would probably do; 120 costs nothing when a
# service answers fast, because `ready` ends on the first passing answer.
ready = 120
rollback = "auto"
# ONE REPO, TWO IMAGES. crunchtools/rotv builds both this and `rotv` from one
# push, by two workflows. A ticket names the SERVICE, so each is deployed on
# its own -- and that matters, because restarting the app is a multi-minute
# outage while restarting this is not. Deploy only the one whose code changed.

[service."rootsofthevalley.org"]
repo = "crunchtools/rotv"
image = "quay.io/crunchtools/rotv"
unit = "rootsofthevalley.org.service"
nagios_host = "ctr-rootsofthevalley.org"
requestors = ["scott"]
probe = { kind = "http", url = "http://127.0.0.1:8082/api/health", expect_status = 200 }
settle = 60
# A RESTART HERE BOOTS POSTGRESQL AND RUNS EVERY MIGRATION BEFORE THE BACKEND
# LISTENS, which is a multi-minute user-visible outage on the public site. 600
# is not measured and is deliberately far past any plausible answer: `ready`
# ends on the first passing probe, so being generous costs nothing when it
# comes up fast, while being short invents a failure and rolls back a healthy
# deploy. That is bug 5 of this program, and this is the service most likely
# to repeat it.
ready = 600
# MANUAL, not auto, and this row had it wrong until 2026-11-08. The README's
# own rule is that a service with database migrations is `rollback = "manual"`,
# because old code against a new schema is worse than a failed deploy with the
# downtime still open -- and the comment directly above says a restart here
# runs every migration. ROTV's migrations are numbered and forward-only, so an
# automatic rollback to the previous image would put the old backend on a
# schema it has never seen, on the public site, unattended. A failure now
# leaves the new code running and hands it to a person: `deployer rollback
# rootsofthevalley.org` is the one command, and the rollback image stays on the
# host.
rollback = "manual"

[service."postiz.crunchtools.com"]
repo = "crunchtools/postiz"
image = "quay.io/crunchtools/postiz"
unit = "postiz.crunchtools.com.service"
nagios_host = "ctr-postiz.crunchtools.com"
requestors = ["scott"]
# Measured before onboarding. NOT "/" -- that is a 307 to /auth, which proves
# only that something is routing. NOT /api/health -- 404 here. /p/health is a
# real health route and answers 200.
probe = { kind = "http", url = "http://127.0.0.1:8092/p/health", expect_status = 200 }
settle = 60
# Node plus Temporal plus Prisma behind it. Not measured; deliberately well
# past any plausible answer, because ready ends on the first passing probe so
# a generous window costs nothing when it comes up fast.
ready = 300
rollback = "auto"

[service."proxy.crunchtools.com"]
repo = "crunchtools/proxy"
image = "quay.io/crunchtools/proxy"
unit = "proxy.crunchtools.com.service"
nagios_host = "ctr-proxy.crunchtools.com"
requestors = ["scott"]
# THIS PROBE CHECKS THE CERTIFICATE, NOT JUST A STATUS CODE, and that is the
# whole reason this service could not be onboarded until 0.4.0.
#
# proxy serves every site on the estate by Host header and terminates TLS. The
# only other probe expressible against it is a plain GET to port 80, which
# answers 301 -- and would answer 301 just as happily with no certificate
# loaded, the wrong certificate loaded, or mod_ssl failing to start. That is
# the one failure this service exists to prevent, so a probe blind to it is not
# worth having on the host's most important container.
#
# server_name goes out as both the SNI and the Host header; ca_file is the
# Cloudflare Origin CA root shipped inside the deployer image. Python verifies
# the chain, the dates and the hostname, so the deploy is accepted only if the
# certificate being served still verifies as this name.
#
# Measured against the live proxy from inside the deployer image before
# onboarding: crunchtools.com gave 200, www.crunchtools.com gave 301 (the cert
# covers the wildcard), and not-ours.example.com was REFUSED with
# CERTIFICATE_VERIFY_FAILED, hostname mismatch. The refusal is the point.
probe = { kind = "http", url = "https://127.0.0.1:443/", server_name = "crunchtools.com", ca_file = "/etc/deployer/cloudflare-origin-ca.pem", expect_status = 200 }
settle = 60
# httpd with mod_ssl and no application behind it, so it answers quickly. 120
# is generous and costs nothing, since ready ends on the first passing probe.
ready = 120
rollback = "auto"

[service."trentina"]
repo = "crunchtools/trentina"
image = "quay.io/crunchtools/trentina"
# The container is `trentina`; the unit carries the full hostname.
unit = "trentina.crunchtools.com.service"
nagios_host = "ctr-trentina.crunchtools.com"
requestors = ["scott"]
# This is the gateway every seat and every MCP backend talks through, so the
# probe asserts more than "something answered on 8019". /health returns
# {"status":"ok","classifier":"loaded",...}, and `classifier":"loaded"` is the
# one field worth holding: the gateway's whole job is judging content, and a
# process that serves /health with no classifier loaded is serving nothing that
# matters. A 200 alone would pass for that.
probe = { kind = "http", url = "http://127.0.0.1:8019/health", expect_status = 200, expect_body = "\"classifier\":\"loaded\"" }
# The gateway answered 12s after a measured restart on 2026-11-08. `ready` ends
# on the first passing probe, so 180 is margin and costs nothing.
ready = 180
# Longer than the fleet default. The failure this service actually has is not a
# crash but memory growth: on 2026-11-07 an unreleased 6.11.0 build climbed to
# the unit's 4g cap over about two hours and was SIGKILLed, taking the git
# proxy, the egress listener and all three developer seats with it. No settle
# window catches a two-hour curve -- the Nagios "Container memory" check is
# what catches that, at 85% and 95% of the cgroup limit, which the 8g cap puts
# at 6.8G and 7.6G. 120s is here to catch a fast crash loop, and the honest
# statement is that this window does not prove memory behaviour.
settle = 120
rollback = "auto"

[service."kagetora.crunchtools.com"]
repo = "crunchtools/hermes"
image = "quay.io/crunchtools/hermes"
unit = "kagetora.crunchtools.com.service"
nagios_host = "ctr-kagetora.crunchtools.com"
requestors = ["scott"]
# A LOG PROBE, because this seat answers nothing over the network. Nagios
# monitors it with "Container is running", which is true of a container whose
# main process is `sleep`. The entrypoint prints `ready: cron list answered
# after Ns` once the gateway is actually taking commands, and `gave up: ...` on
# failure -- two lines with no shared substring, so a watcher told to wait for
# one cannot be satisfied by the other. The deployer reads the log only since
# this container's own StartedAt, so the previous run's line cannot pass, and
# then holds on the container's identity and restart count for the settle
# window rather than re-reading the log.
probe = { kind = "log", expect = "ready:" }
ready = 180
settle = 120
# MANUAL, and this is a decision rather than caution. Hermes keeps its state in
# /app/.hermes, and whether it migrates that directory forward on start is NOT
# known: the Hermes package is upstream and is not vendored in this repo, so
# there is nothing here to read. Until someone reads it, an automatic rollback
# could put older code on a data dir a newer version has already written. A
# failed deploy therefore leaves the new image running and hands it to a
# person: `deployer rollback kagetora.crunchtools.com`.
rollback = "manual"

[service."josui.crunchtools.com"]
repo = "crunchtools/josui"
image = "quay.io/crunchtools/josui"
unit = "josui.crunchtools.com.service"
nagios_host = "ctr-josui.crunchtools.com"
requestors = ["scott"]
# A LOG PROBE. Like kagetora this seat answers nothing over the network, and
# from outside a Claude Code seat looks like a process sitting still. The
# entrypoint prints `serving: taking commands on <socket> after Ns` once the
# control socket exists, and `gave up: <socket> never appeared in Ns` when it
# does not. The two share no substring, so a watcher waiting for one cannot be
# satisfied by the other -- which was the first draft's bug, and a readiness
# check that cannot fail is worse than none because it gets trusted.
probe = { kind = "log", expect = "taking commands" }
ready = 180
settle = 120
# AUTO, unlike kagetora, and for a reason rather than by default. This seat's
# persistent state is Claude Code's own configuration, in the home directory
# mounted into it -- nothing there owns a schema or migrates it, so there is no
# old-code-on-new-data hazard to protect. What there is instead is a seat Scott
# talks to through a Matrix bridge, so coming back by itself is worth more than
# being held for a person. The sign-in survives a rollback either way: the credentials live in
# the mounted state directory, not in the image.
rollback = "auto"
