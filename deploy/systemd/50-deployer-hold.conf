# Skip the nightly update while the deploy robot is holding a service.
#
# /srv copy: /srv/deployer.crunchtools.com/config/50-deployer-hold.conf
#
# WHY THIS EXISTS. When a deploy does not verify, the deployer puts the service
# back on its previous image and writes a hold file. But `:latest` in the
# registry still carries the image that just failed, so without this the next
# `podman auto-update` pulls it and deploys it again -- unattended, at 03:00,
# with nobody watching. The hold is only protection if something honours it,
# and this file is that something.
#
# WRITTEN BY HAND, NEVER BY THE DEPLOYER. The deployer holds no capability to
# write a unit file or a drop-in, which is the point: a program that could
# rewrite its own guard would not be guarded. It refuses to run at all when
# this file is missing, because a hold nothing honours is worse than no hold,
# and check_deployer.sh goes CRITICAL on the same condition.
#
# ExecCondition AND NOT ExecStartPre. A failing ExecCondition makes systemd
# *skip* the unit and record the result as success, so a held service does not
# also leave podman-auto-update.service in a failed state for somebody to
# clear. An ExecStartPre that failed would do the opposite.
#
# THE TEST IS "NO HOLD FILES", not "no hold directory": the directory is
# created when the first hold is placed and is not removed when the last one is
# cleared. A `find` that cannot read the directory finds nothing and the update
# proceeds -- which is the wrong direction, but it is also the direction that
# does not freeze fleet updates on a permissions mistake, and check_deployer.sh
# reports an unreadable hold directory as UNKNOWN so it does not go unnoticed.
#
# This skips the WHOLE host's update, not one service. 0.1.0 has no per-unit
# hold, and the Nagios check therefore goes CRITICAL on any hold standing 24
# hours: while it stands, nothing on this host auto-updates.
[Service]
ExecCondition=/bin/sh -c '! /usr/bin/find /var/lib/deployer/hold -mindepth 1 -maxdepth 1 -type f 2>/dev/null | /usr/bin/grep -q .'
