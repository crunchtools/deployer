[project]
name = "deployer"
version = "0.0.0"
description = "Deterministic deploy robot: drains the RT Deploy queue, deploys by commit, verifies, rolls back once"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "crunchtools.com" }]
readme = "README.md"
keywords = ["deploy", "podman", "systemd", "rt", "request-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# httpx talks to the podman REST API over its unix socket; dbus-fast talks to
# systemd. Neither the podman nor the systemctl binary is in the image, which
# is what keeps this process to the verbs it declares.
dependencies = [
    "httpx>=0.28",
    "dbus-fast>=2.21",
]

[project.scripts]
deployer = "deployer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.14", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deployer"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Set explicitly: unset, pytest-asyncio warns and the default changes under us
# in a later release.
asyncio_default_fixture_loop_scope = "function"

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]
