[project]
name = "deployer"
version = "0.10.4"
description = "Deterministic deploy robot: drains the RT Deploy queue, deploys by commit, verifies, rolls back once"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "crunchtools.com" }]
readme = "README.md"
keywords = ["deploy", "podman", "systemd", "rt", "request-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# httpx talks to the podman REST API over its unix socket; dbus-fast talks to
# systemd. Neither the podman nor the systemctl binary is in the image, which
# is what keeps this process to the verbs it declares.
# tzdata is here because the base image carries no /usr/share/zoneinfo and RT
# renders its dates in a named zone; without it ZoneInfo raises at startup.
dependencies = [
    "httpx>=0.28",
    "dbus-fast>=2.21",
    "tzdata>=2024.2",
]

[project.scripts]
deployer = "deployer.cli:main"
cve-enqueue = "deployer.enqueue:main"
release-follow = "deployer.follow:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "mypy>=1.14",
    "ruff>=0.17.5",
    "trustme>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deployer"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Set explicitly: unset, pytest-asyncio warns and the default changes under us
# in a later release.
asyncio_default_fixture_loop_scope = "function"

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["cli-tool"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/deployer"
# sdlc does not enforce boot = "command" (crunchtools/sdlc#118). A oneshot with
# nothing listening has no long-running process to boot, so the gate is the
# [tool.sdlc.ci] boot-* checks, run inside the image this PR builds.
boot = "none"
boot-none-reason = "a oneshot CLI image with no long-running process; the boot gate is the [tool.sdlc.ci] boot-* checks against this PR's built image"

[tool.sdlc.ci]
checks = ["deployer-image", "boot-version", "boot-help"]

[tool.sdlc.ci.deployer-image]
kind = "image-build"

# The runtime image is Hummingbird python with no shell, so one command check
# per assertion. argv[0] becomes the entrypoint, so the image's own
# `python -m deployer` is what runs. The old gate used `podman run --rm`; the
# root fs here is not read-only, which the old gate did not assert either.
[tool.sdlc.ci.boot-version]
kind = "command"
image = "localhost/deployer:sdlc"
argv = ["python", "-m", "deployer", "--version"]

[tool.sdlc.ci.boot-help]
kind = "command"
image = "localhost/deployer:sdlc"
argv = ["python", "-m", "deployer", "--help"]
