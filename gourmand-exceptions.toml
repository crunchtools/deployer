# Gourmand exceptions. Each one names the rule, the place, and why the rule is
# wrong here rather than inconvenient.

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina, mcp-podman and mcp-systemd.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"

# "2025-06-18" is the MCP protocol version string sent in an `initialize`
# handshake, not a date this file is stale about. It is fixed by the protocol:
# changing it to the current year would make the probe send a version no server
# implements.
[[exceptions]]
check = "hardcoded_years"
path = "src/deployer/verify.py"
justification = "2025-06-18 is the MCP protocol version string sent in the initialize handshake, fixed by the protocol; it is not a date this file is stale about, and bumping it would make the probe announce a version no server implements"
classification = "by_design"

# `_units` has two call sites, both inside an `async with` body: once in
# `_restore` (the by-hand rollback) and once in `_drain` (the queue run). The
# check appears not to count calls nested in a with-statement. Inlining the
# comprehension at both would duplicate the one place that decides which units
# this process may touch, which is a worse answer than this note.
[[exceptions]]
check = "single_use_helpers"
path = "src/deployer/cli.py"
pattern = "_units"
justification = "called from both _restore and _drain, each inside an `async with` body; the check does not appear to count calls nested in a with-statement, and inlining would duplicate the single definition of this process's unit scope"
classification = "gourmand_bug"

# `Hands` is constructed in production, in `_restore`, when nothing was passed
# in -- also inside an `async with` body. It exists so the by-hand rollback can
# be tested at all: that path moves `:latest` and restarts a production unit,
# and before it had a seam it had no tests.
[[exceptions]]
check = "dead_structs"
path = "src/deployer/cli.py"
pattern = "Hands"
justification = "instantiated in _restore when no clients are injected, inside an `async with` body which the check does not appear to see; the seam exists so the by-hand rollback path -- which moves :latest and restarts a unit -- can be tested"
classification = "gourmand_bug"

# parse_status reads grype's `key=value` status format (space-delimited, `CVE
# ...` lines); rt._parse_fields reads RT's `key: value` show format (colon-
# delimited, with indented continuation lines). The loop skeleton -- iterate
# lines, skip/continue, assign into a dict -- is structurally similar, but the
# two parse different wire formats for different systems. Merging them would
# couple the CVE scanner's format to RT's for the sake of three shared lines.
[[exceptions]]
check = "copy_paste_detection"
path = "src/deployer/enqueue.py"
pattern = "parse_status"
justification = "parse_status parses grype's key=value cve.status format; rt._parse_fields parses RT's key: value show format with continuation lines -- different wire formats for different systems; the shared shape is a line loop, and merging would couple the scanner's format to RT's"
classification = "gourmand_bug"

# An environment file's values ARE paths. The two the rule objects to are
# `DEPLOYER_STATE` and `PODMAN_SOCKET`, and their values are the deployment
# facts the example exists to show someone setting up a second one. Naming them
# here rather than quoting them, because quoting them trips the same rule in
# this file. The rule is right about code -- the program itself holds no
# built-in paths, which is why a missing variable is exit 2 rather than a guess
# -- and that is exactly why they have to be written down somewhere. The real
# file lives on the host at 0600; this is its example.
[[exceptions]]
check = "absolute_paths"
path = "deploy/deployer.env.example"
justification = "the values of an env file are paths by nature; these two are the deployment facts the example exists to show, and the program itself holds no built-in paths, which is the behaviour this rule protects"
classification = "by_design"

# The cve-enqueue secret example names the srv-secrets decrypt target its
# credential lands at — a deployment fact an operator provisioning the unit
# needs, exactly like deployer.env.example above. Not quoting the path here,
# because quoting it would trip this same rule in this file (as the note above
# records); the program itself holds no built-in paths.
[[exceptions]]
check = "absolute_paths"
path = "deploy/cve-enqueue.env.example"
justification = "an env-file example names deployment paths by nature; the srv-secrets decrypt target is the fact an operator needs to provision the unit, as with deployer.env.example, and the program holds no built-in paths"
classification = "by_design"
