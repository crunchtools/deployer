# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge does not
# rebuild: it promotes the pull request's gated digest to :main, and a v* tag
# copies main's digest to the version tags and :latest. Quay.io only.
#
# Production pins a version tag (deployer:X.Y.Z on gloval), so a release is
# what ships; :main is what the next release will be.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "41 5 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.39.4
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/deployer
      boot: command
      # The entrypoint and every module it imports load in the shipped image.
      # A real run needs the RT queue and the host's podman socket.
      boot-command: |
        set -e
        podman run --rm "$IMAGE" --version
        podman run --rm "$IMAGE" --help >/dev/null
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
