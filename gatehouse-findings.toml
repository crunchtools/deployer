# Gatehouse findings judged rather than fixed. Each one says why the finding is
# wrong here, not why fixing it is inconvenient.

# The queue is a handful of tickets, not a page of them, and RT is on the
# loopback. The per-ticket fetch is what keeps one unreadable ticket from
# poisoning the batch -- tests/test_runner.py pins that property, because the
# queue is other people's work and one bad ticket blocking the rest would be a
# denial of service anybody who can file a ticket could cause. A `format=l`
# search would return every ticket's fields in one call and lose exactly that.
[[findings]]
agent = "performance"
category = "performance"
file = "src/deployer/runner.py"
evidence = "ids = await self.clients.rt.open_tickets(self.queue)\n\nresults: list[TicketResult] = []\nfor ticket_id in ids:\n    results.append(await self._ticket(ticket_id))"
status = "not-a-bug"
reason = "N is the depth of a deploy queue -- a handful -- and RT is on the loopback, so the extra round trips are not a cost worth trading for. Fetching the batch in one search would mean one malformed ticket could poison the whole read, and isolating that is a property this program is tested for."

# The ExecStart half of the unit-shape gate is not a guarantee and the code now
# says so. Which word of `podman run [options] IMAGE [command]` is the image
# cannot be decided without knowing which of podman's hundred-odd options take
# values -- `-v /srv/x/config:/config:ro` is a single word containing both a
# slash and a colon, and every real unit on this fleet has several.
#
# What the gate CAN prove, it proves from evidence: ImageName on the running
# container is the reference the unit created it from. The case this finding
# names -- a unit edited to run something else, with ours left behind as an
# option value -- is caught by verification, which compares the running
# container's image id against the candidate and rolls back on a mismatch.
#
# The real consequence of that case was that it blamed the revision for a unit
# problem, which would have blacklisted a perfectly good commit for ever.
# Outcome.ran_something_else now carries the distinction, and adf7efb's
# follow-up stops the attempt being recorded. Tested.
[[findings]]
agent = "bugs"
category = "bug"
file = "src/deployer/stage.py"
evidence = "latest not in words"
status = "not-a-bug"
reason = "podman's option grammar makes the image operand undecidable without a table of which options take values; the gate proves what it can from ImageName and verification catches the rest, rolling back and -- now -- not blaming the revision for a unit that was edited behind this program's back"

# One cancel per window, awaited in turn, on purpose. cmd.cgi is a CGI: each
# request is a process that reads Nagios's whole status file, and mcp-nagios
# documents the 500s that come of leaning on it (its models.py says a comment
# with a character outside ASCII crashes statusjson.cgi outright). It cancels
# them serially for the same reason, and following the fleet's one working
# precedent beats parallelising a path that runs twice per deploy.
#
# The count is also small: this program opens one host window and one
# host-services window, so the host's own services are the only multiplier, and
# a handful of 200ms CGI calls at the end of a deploy that just held a settle
# window for sixty seconds is not where the time goes.
[[findings]]
agent = "performance"
category = "performance"
file = "src/deployer/nagios.py"
evidence = "for entry_id, is_service in wanted:"
status = "not-a-bug"
reason = "cmd.cgi is a CGI process per request reading the whole status file; mcp-nagios cancels serially for that reason and documents the failures that come of leaning on it, and the count here is a handful at the end of a deploy that just spent a minute settling"

# Gatehouse's constitution agent read "deployer may not create, start, run or
# exec a container" as forbidding the `podman run` in this systemd unit. But the
# rule's subject is the deployer PROCESS and package — "no module in the package
# exposes such a verb" — so that a compromised deployer cannot mount a live
# volume and relabel it. This `podman run` is systemd's ExecStart launching the
# oneshot on the host, the same line deployer.crunchtools.com.service uses to
# start the robot and every containerized service on gloval uses to start. Read
# Gatehouse's way, the rule would forbid deployer's own unit. The cve-enqueue
# PROCESS inside holds no podman or D-Bus socket, drops all caps, is read-only
# and no-new-privileges — it cannot touch a container. (cto ruling, 2026-11-11.)
[[findings]]
agent = "constitution"
category = "constitution"
file = "deploy/systemd/cve-enqueue.crunchtools.com.service"
evidence = "ExecStart=/usr/bin/podman run --rm --name cve-enqueue.crunchtools.com"
status = "not-a-bug"
reason = "the capability boundary binds the deployer process and package ('no module exposes such a verb'), not systemd's ExecStart; this podman run is the host launching the oneshot, as deployer's own unit does, and the process inside holds no socket and no caps so it cannot touch a container"
